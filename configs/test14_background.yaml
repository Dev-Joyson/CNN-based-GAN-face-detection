# Test14: background only -- the face ellipse is zeroed, so any signal the model
# finds comes from hair/shoulders/background. Control for "is it just the face?".
name: test14_background

real_dir: "/content/drive/MyDrive/Real(FFHQ)"
fake_dir: "/content/drive/MyDrive/FakeMix"

mask_mode: background_only
limit_per_class: 20000

img_size: 256
native_size: 512
batch_size: 144

epochs: 500
lr: 0.0003
patience: 6
seed: 42

cache_dir: "/content/cache"
out_dir: "/content/drive/MyDrive/Research/experiments"

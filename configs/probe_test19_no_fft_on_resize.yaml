# PROBE, not an experiment: the HEADLINE (no-FFT crop) model's weights (name -> its run
# dir) scored on the RESIZE pipeline's test set (input_mode resize, i.e. the
# whole face downsampled 1024->512->256 -- what a 256^2 input looks like).
# Answers: what happens when the native-resolution detector is given a
# downscaled image? Run with --tag on_resize so it writes eval_on_resize.json
# beside test19's own results instead of over them.
name: test19_sg2_crop_no_fft
fft_branch: false

real_dir: "/content/drive/MyDrive/Real(FFHQ)"
fake_dir: "/content/drive/MyDrive/Fake(SG2-psi1)"

mask_mode: none
limit_per_class: 25000

img_size: 256
native_size: 512
batch_size: 144

epochs: 150               # let patience decide
lr: 0.0003
patience: 15              # 6 cut the test16 ablation off mid-climb; both runs sat at 0.960 at epoch 61
seed: 42

crop_frac_min: 0.85
shuffle_buffer: 8192         # train split is 28000; a full-set buffer would be ~5.5 GB of
                             # uint8 images in RAM -- too much for a standard Colab runtime.
                             # Raise toward 28000 on a high-RAM runtime if you want the
                             # notebook's whole-set shuffle.

cache_dir: "/content/cache"
out_dir: "/content/drive/MyDrive/Research/experiments"

# Test30: the fourth point on the compute axis -- stride 2 with width 0.75
# (24-48-96-192-192), between test21 (width 1.0, 0.28 G, 0.9988) and test27
# (width 0.5, 0.073 G, 0.9983). Same data, split, seed, cache and recipe as the
# headline (no BN: test29 showed BN changes speed, not the ceiling, and shifts
# the threshold).
#
# Why: test27's gap to the headline is capacity -- distillation (test28) and
# optimisation (test29) both left it at 0.998. This run asks where on the width
# axis 0.99 accuracy is regained, i.e. the smallest plain-conv model that still
# matches the headline. Howard et al. 2017's alpha = 0.75 point. es_start_epoch
# 40 and the 250 cap as for test27 (a smaller net needs the epochs).
name: test30_stride2_width075
width_mult: 0.75
es_start_epoch: 40         # a smaller from-scratch net may sit at chance longer; do not kill it unstarted
stem_stride: 2
fft_branch: false

real_dir: "/content/drive/MyDrive/Real(FFHQ)"
fake_dir: "/content/drive/MyDrive/Fake(SG2-psi1)"

mask_mode: none
limit_per_class: 25000

img_size: 256
native_size: 512            # unused in crop mode
input_mode: crop
cache_size: 512             # centre 512^2 at native pixels; 768 keeps the hair, 1024 everything -- see model.Config
batch_size: 144

epochs: 250               # ran to 150 still climbing (val 0.9967 at 149); extended
lr: 0.0003
patience: 15              # 6 cut the test16 ablation off mid-climb; both runs sat at 0.960 at epoch 61
seed: 42

crop_frac_min: 0.85
shuffle_buffer: 8192         # train split is 28000; a full-set buffer would be ~5.5 GB of
                             # uint8 images in RAM -- too much for a standard Colab runtime.
                             # Raise toward 28000 on a high-RAM runtime if you want the
                             # notebook's whole-set shuffle.

cache_dir: "/content/cache"
out_dir: "/content/drive/MyDrive/Research/experiments"

# Test24: the headline with SCALE augmentation -- training windows drawn at
# 256^2 (f=1) and 512^2-resized-to-256^2 (f=2) native pixels, half each. Same
# data, split, seed, cache, architecture and recipe; eval unchanged (centre
# native window). Latency and memory untouched by construction.
#
# Why: on downscaled input (1024->512->256, the on-resize probe) the headline
# is at chance (0.556): its fingerprint is scale-specific, the failure mode
# Gragnaniello et al. 2021 report for social-media re-uploads. f=2 is the
# half-scale view; f=4 (the probe's scale) would need cache_size 1024
# (157 GB) and is not affordable here -- stated. Scored on the on-resize probe
# (evaluate.py --tag on_resize via probe_test19_no_fft_on_resize's recipe),
# SG3-R for selection, SG3-T once.
name: test24_sg2_crop_scale_aug
scale_aug: [1, 2]
fft_branch: false

real_dir: "/content/drive/MyDrive/Real(FFHQ)"
fake_dir: "/content/drive/MyDrive/Fake(SG2-psi1)"

mask_mode: none
limit_per_class: 25000

img_size: 256
native_size: 512            # unused in crop mode
input_mode: crop
cache_size: 512             # centre 512^2 at native pixels; 768 keeps the hair, 1024 everything -- see model.Config
batch_size: 144

epochs: 150               # let patience decide
lr: 0.0003
patience: 15              # 6 cut the test16 ablation off mid-climb; both runs sat at 0.960 at epoch 61
seed: 42

crop_frac_min: 0.85
shuffle_buffer: 8192         # train split is 28000; a full-set buffer would be ~5.5 GB of
                             # uint8 images in RAM -- too much for a standard Colab runtime.
                             # Raise toward 28000 on a high-RAM runtime if you want the
                             # notebook's whole-set shuffle.

cache_dir: "/content/cache"
out_dir: "/content/drive/MyDrive/Research/experiments"

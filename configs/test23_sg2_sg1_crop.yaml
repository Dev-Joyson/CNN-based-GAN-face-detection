# Test23: the headline trained on TWO generators -- 15,000 StyleGAN2 (official,
# psi=1.0) + 10,000 StyleGAN1 (the FakeSG1 folder; provenance in README Data) --
# with StyleGAN3 held out. Same 25k/class, split rule, seed, architecture and
# recipe; the cache is new (different fake folders -> different key).
#
# Why: a detector that sees one generator learns that generator's fingerprint
# (Ojha et al. 2023). Generator diversity in training is the other lever the
# literature offers that leaves the network -- and its latency -- unchanged.
# The ratio is the FakeMix manifest's (60/40), stated here rather than inferred.
#
# Selection on StyleGAN3-R; StyleGAN3-T scored once at the end. If test22's
# augmentation helps, a test24 combines both.
name: test23_sg2_sg1_crop
fft_branch: false

real_dir: "/content/drive/MyDrive/Real(FFHQ)"
fake_dir:
  - "/content/drive/MyDrive/Fake(SG2-psi1)"
  - "/content/drive/MyDrive/Research/Dataset New/FakeSG1"
fake_mix: [15000, 10000]   # sums to limit_per_class; the FakeMix manifest ratio

mask_mode: none
limit_per_class: 25000

img_size: 256
native_size: 512            # unused in crop mode
input_mode: crop
cache_size: 512             # centre 512^2 at native pixels; 768 keeps the hair, 1024 everything -- see model.Config
batch_size: 144

epochs: 150               # let patience decide
lr: 0.0003
patience: 15              # 6 cut the test16 ablation off mid-climb; both runs sat at 0.960 at epoch 61
seed: 42

crop_frac_min: 0.85
shuffle_buffer: 8192         # train split is 28000; a full-set buffer would be ~5.5 GB of
                             # uint8 images in RAM -- too much for a standard Colab runtime.
                             # Raise toward 28000 on a high-RAM runtime if you want the
                             # notebook's whole-set shuffle.

cache_dir: "/content/cache"
out_dir: "/content/drive/MyDrive/Research/experiments"

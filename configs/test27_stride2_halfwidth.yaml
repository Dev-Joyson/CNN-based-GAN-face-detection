# Test27: the compute axis pushed one step past the stride-2 stem -- stride 2 AND
# every conv width halved (16-32-64-128-128). Same data, split, seed, cache and
# recipe as the headline. The question: how far can a from-scratch model's
# arithmetic drop before StyleGAN2 accuracy gives way? Stride 2 alone cost
# 0.001 AUC for 4x fewer MACs (test21); this is ~4x fewer again, close to
# MobileNetV3-Small's 0.07 G. If it holds 0.99+, it is the model to hand to a
# mobile-deployment follow-up; if it drops, the stride-2 model is the floor and
# the drop is the measured reason. Evaluate, JPEG q95, and quantize like test21.
name: test27_stride2_halfwidth
width_mult: 0.5
es_start_epoch: 40         # a smaller from-scratch net may sit at chance longer; do not kill it unstarted
stem_stride: 2
fft_branch: false

real_dir: "/content/drive/MyDrive/Real(FFHQ)"
fake_dir: "/content/drive/MyDrive/Fake(SG2-psi1)"

mask_mode: none
limit_per_class: 25000

img_size: 256
native_size: 512            # unused in crop mode
input_mode: crop
cache_size: 512             # centre 512^2 at native pixels; 768 keeps the hair, 1024 everything -- see model.Config
batch_size: 144

epochs: 250               # ran to 150 still climbing (val 0.9967 at 149); extended
lr: 0.0003
patience: 15              # 6 cut the test16 ablation off mid-climb; both runs sat at 0.960 at epoch 61
seed: 42

crop_frac_min: 0.85
shuffle_buffer: 8192         # train split is 28000; a full-set buffer would be ~5.5 GB of
                             # uint8 images in RAM -- too much for a standard Colab runtime.
                             # Raise toward 28000 on a high-RAM runtime if you want the
                             # notebook's whole-set shuffle.

cache_dir: "/content/cache"
out_dir: "/content/drive/MyDrive/Research/experiments"

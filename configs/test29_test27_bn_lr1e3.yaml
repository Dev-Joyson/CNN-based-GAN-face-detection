# Test29: test27 (stride 2, half width, 262k params) with batch normalisation
# after every conv and lr 1e-3 -- the optimisation levers, from scratch.
#
# Why: test27 reached 0.9983 / acc 0.98 against the headline's 0.9998 / 0.99,
# and distilling the headline into it (test28) added nothing, so the gap is not
# missing supervision. Two candidates remain: optimisation (a small net with a
# weak cold-start gradient -- test27 sat at chance to epoch ~12 and peaked at
# 209) and capacity. This run tests optimisation: BN (Ioffe & Szegedy 2015) for
# gradient flow from epoch 1, and Adam's default lr 1e-3 (Kingma & Ba 2015),
# which suits a small network better than the headline's 3e-4. It doubles as
# the learning-rate sensitivity run the hyperparameter table still owes. Two
# variables vs test27, stated; if it matters, they can be separated. BN folds
# at inference: same MACs, +0.2% params. es_start_epoch 40 as in test27.
name: test29_test27_bn_lr1e3
batchnorm: true
width_mult: 0.5
es_start_epoch: 40         # a smaller from-scratch net may sit at chance longer; do not kill it unstarted
stem_stride: 2
fft_branch: false

real_dir: "/content/drive/MyDrive/Real(FFHQ)"
fake_dir: "/content/drive/MyDrive/Fake(SG2-psi1)"

mask_mode: none
limit_per_class: 25000

img_size: 256
native_size: 512            # unused in crop mode
input_mode: crop
cache_size: 512             # centre 512^2 at native pixels; 768 keeps the hair, 1024 everything -- see model.Config
batch_size: 144

epochs: 250
lr: 0.001                  # Adam default; headline uses 3e-4
patience: 15              # 6 cut the test16 ablation off mid-climb; both runs sat at 0.960 at epoch 61
seed: 42

crop_frac_min: 0.85
shuffle_buffer: 8192         # train split is 28000; a full-set buffer would be ~5.5 GB of
                             # uint8 images in RAM -- too much for a standard Colab runtime.
                             # Raise toward 28000 on a high-RAM runtime if you want the
                             # notebook's whole-set shuffle.

cache_dir: "/content/cache"
out_dir: "/content/drive/MyDrive/Research/experiments"
